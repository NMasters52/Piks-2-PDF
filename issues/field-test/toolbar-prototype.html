<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Walk toolbar prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edece8;color:#20231f;font:16px system-ui}main{max-width:640px;height:100dvh;margin:auto;background:white;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header,footer,aside,article,section{padding:12px 16px}header,footer,nav{background:white;border-bottom:1px solid #ccc}header,footer,aside,nav{display:flex;align-items:center;gap:8px}header{justify-content:space-between}button,select{font:inherit;background:white;border:1px solid #777;border-radius:5px;padding:9px;cursor:pointer}section{overflow:auto;padding:0}article{border:1px solid #ddd;margin:12px;border-radius:5px;display:grid;gap:8px}label{font-size:14px}textarea{display:block;width:100%;font:inherit}footer button{flex:1}footer button:first-child{background:#26382c;color:white}aside{background:#eee;font-size:13px}aside button{margin-left:auto}nav{padding:8px 12px}.sticky{position:sticky;top:0}h2,p{margin:4px 12px}header span{font-size:13px}dialog{border:1px solid #888;border-radius:8px}
footer{padding:8px max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));border-top:1px solid #ccc}footer button{min-height:44px;padding:6px;font-size:15px}nav{z-index:1}header button{font-size:14px}button:disabled{opacity:.45;cursor:default}nav button{min-height:44px}</style>
<main><header><b>Pik-2-PDF</b></header>
<section id="walk" tabindex="-1"><h2>Lot 22</h2><p>50 photos</p><nav class="sticky" aria-label="Walk actions"><button>Export PDF</button><button>New walk</button><button id="jump">Jump to bottom ↓</button></nav><div id="photos"></div></section>
<footer><button>Take photo</button><button>Add photos</button><button id="back" disabled>Back to top ↑</button></footer></main>
<dialog><p id="message"></p><button onclick="this.parentElement.close()">Close</button></dialog>
<script>
const list=document.querySelector('#photos'),walk=document.querySelector('#walk');
for(let i=1;i<=50;i++){const card=document.createElement('article');card.innerHTML='<b>Photo '+i+'</b><label>Note (optional)<textarea rows="2"></textarea></label>';list.append(card)}
const back=document.querySelector('#back');
function syncBack(){back.disabled=walk.scrollTop<=0}
walk.addEventListener('scroll',syncBack);
window.addEventListener('pageshow',syncBack);
document.querySelector('#jump').onclick=()=>{walk.scrollTop=walk.scrollHeight};
document.querySelector('#back').onclick=()=>{walk.focus({preventScroll:true});walk.scrollTop=0};
document.querySelectorAll('nav button:not(#jump),footer button:not(#back)').forEach(b=>b.onclick=()=>{document.querySelector('#message').textContent=b.textContent+' selected in prototype.';document.querySelector('dialog').showModal()});
</script></html>
